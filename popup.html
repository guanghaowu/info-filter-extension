<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>信息源过滤器</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      width: 300px;
      padding: 16px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }

    h1 {
      font-size: 18px;
      color: #333;
      margin-bottom: 12px;
    }

    .section {
      margin-bottom: 16px;
    }

    .section-title {
      font-size: 14px;
      color: #666;
      margin-bottom: 8px;
    }

    .goal-list {
      list-style: none;
    }

    .goal-item {
      padding: 8px;
      background: #f5f5f5;
      border-radius: 4px;
      margin-bottom: 4px;
      font-size: 14px;
    }

    .stat {
      display: flex;
      justify-content: space-between;
      padding: 8px 0;
      border-bottom: 1px solid #eee;
      font-size: 14px;
    }

    .stat-label {
      color: #666;
    }

    .stat-value {
      color: #333;
      font-weight: 500;
    }

    .report-btn {
      width: 100%;
      padding: 10px;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-size: 14px;
    }

    .report-btn:hover {
      opacity: 0.9;
    }
  </style>
</head>
<body>
  <h1>信息源过滤器</h1>

  <div class="section">
    <div class="section-title">今日目标</div>
    <ul class="goal-list" id="goalList">
      <li class="goal-item">加载中...</li>
    </ul>
  </div>

  <div class="section">
    <div class="section-title">今日统计</div>
    <div class="stat">
      <span class="stat-label">访问页面</span>
      <span class="stat-value" id="visitedCount">0</span>
    </div>
    <div class="stat">
      <span class="stat-label">破戒次数</span>
      <span class="stat-value" id="escapeCount">0</span>
    </div>
  </div>

  <button class="report-btn" id="viewReport">查看详细报告</button>

  <script src="storage.js"></script>
  <script src="popup.js"></script>
</body>
</html>
