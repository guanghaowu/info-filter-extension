<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>信息源过滤器 - 设置学习目标</title>
  <link rel="stylesheet" href="styles/overlay.css">
</head>
<body>
  <div class="overlay">
    <div class="overlay-content">
      <h1>今天学什么？</h1>
      <p class="subtitle">设定目标，专注学习</p>
      <input
        type="text"
        id="goalInput"
        placeholder="例如：学习React Hooks、看算法教程..."
        autofocus
      >
      <button id="submitBtn">开始学习</button>
      <p class="hint">输入目标后才能访问内容</p>
    </div>
  </div>
  <script src="storage.js"></script>
  <script src="overlay.js"></script>
</body>
</html>
